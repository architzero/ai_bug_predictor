{% extends "base.html" %}
{% block title %}Scanning — Bug Predictor{% endblock %}

{% block content %}
<div class="min-h-[60vh] flex flex-col items-center justify-center py-12">
  <div class="w-full max-w-lg bg-white p-8 rounded-xl shadow-sm border border-gray-100"
       x-data="scanProgress('{{ scan_id }}')">

    <h2 class="text-2xl font-bold text-gray-900 mb-1">Analyzing Repository</h2>
    <p class="text-sm text-gray-500 mb-6 font-mono" x-text="statusText">Connecting…</p>

    <!-- Progress bar -->
    <div class="mb-8">
      <div class="flex justify-between text-xs text-gray-500 mb-1">
        <span x-text="statusText"></span>
        <span x-text="`${progress}%`"></span>
      </div>
      <div class="w-full bg-gray-100 rounded-full h-2 overflow-hidden">
        <div class="h-2 rounded-full transition-all duration-500 ease-out"
             :class="error ? 'bg-red-500' : progress === 100 ? 'bg-green-500' : 'bg-indigo-600'"
             :style="`width: ${progress}%`"></div>
      </div>
    </div>

    <!-- Step list -->
    <ol class="space-y-3 mb-8">
      <template x-for="step in steps" :key="step.label">
        <li class="flex items-center gap-3">
          <!-- Done -->
          <span x-show="step.status === 'done'"
                class="flex-shrink-0 w-6 h-6 rounded-full bg-green-100 flex items-center justify-center">
            <svg class="w-3.5 h-3.5 text-green-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/>
            </svg>
          </span>
          <!-- Active -->
          <span x-show="step.status === 'active'"
                class="flex-shrink-0 w-6 h-6 rounded-full bg-indigo-100 flex items-center justify-center">
            <svg class="w-3.5 h-3.5 text-indigo-600 animate-spin" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"/>
            </svg>
          </span>
          <!-- Pending -->
          <span x-show="step.status === 'pending'"
                class="flex-shrink-0 w-6 h-6 rounded-full bg-gray-100 flex items-center justify-center">
            <span class="w-2 h-2 rounded-full bg-gray-300"></span>
          </span>

          <span class="text-sm"
                :class="step.status === 'pending' ? 'text-gray-400' : 'text-gray-900 font-medium'"
                x-text="step.label"></span>
        </li>
      </template>
    </ol>

    <!-- Complete -->
    <div x-show="complete && !error"
         class="p-4 bg-green-50 border border-green-200 rounded-lg text-sm text-green-800">
      Analysis complete!
      <a :href="`/results/${scanId}`"
         class="ml-2 font-semibold text-green-700 hover:text-green-600 underline">
        View Results →
      </a>
    </div>

    <!-- Error -->
    <div x-show="error"
         class="p-4 bg-red-50 border border-red-200 rounded-lg">
      <p class="text-sm font-medium text-red-800 mb-2" x-text="error"></p>
      <a href="/" class="text-sm font-medium text-red-600 hover:text-red-500">← Try again</a>
    </div>

  </div>
</div>

<script>
  document.addEventListener('alpine:init', () => {
    Alpine.data('scanProgress', (scanId) => ({
      scanId,
      progress: 0,
      statusText: 'Connecting to server…',
      complete: false,
      error: null,
      eventSource: null,

      // Steps with the progress threshold at which they become "done"
      steps: [
        { label: 'Clone repository',       doneAt: 24,  status: 'pending' },
        { label: 'Analyze code structure', doneAt: 44,  status: 'pending' },
        { label: 'Mine git history',       doneAt: 64,  status: 'pending' },
        { label: 'Engineer features',      doneAt: 79,  status: 'pending' },
        { label: 'Run predictions',        doneAt: 89,  status: 'pending' },
        { label: 'Generate explanations',  doneAt: 99,  status: 'pending' },
      ],

      init() {
        this.eventSource = new EventSource(`/api/scan_progress/${this.scanId}`);

        this.eventSource.onmessage = (event) => {
          try {
            const data = JSON.parse(event.data);
            this.progress   = data.progress || 0;
            this.statusText = data.status   || '';

            // Update step statuses
            this.steps = this.steps.map(step => ({
              ...step,
              status: this.progress > step.doneAt
                ? 'done'
                : this.progress >= step.doneAt - 15
                  ? 'active'
                  : 'pending',
            }));

            if (data.error) {
              this.error = data.error;
              this.eventSource.close();
            } else if (data.complete) {
              this.progress   = 100;
              this.statusText = 'Complete';
              this.complete   = true;
              this.steps      = this.steps.map(s => ({ ...s, status: 'done' }));
              this.eventSource.close();
              setTimeout(() => { window.location.href = `/results/${this.scanId}`; }, 1500);
            }
          } catch (e) {
            console.error('Failed to parse SSE event:', e);
          }
        };

        this.eventSource.onerror = () => {
          this.error = 'Connection lost. Please refresh the page.';
          this.eventSource.close();
        };
      },

      destroy() {
        if (this.eventSource) this.eventSource.close();
      },
    }));
  });
</script>
{% endblock %}
